<!doctype html>
<html>
  <head>
    <title>Computer-Player Tester</title>
    <link rel="stylesheet" href="./vendor/destyle.css" />
    <link rel="stylesheet" href="./index.css" />
    <meta charset="utf-8" />
  </head>

  <body>
    <div id="view-container">
      <div id="game-container" style="display: flex; flex-direction: column; align-items: center">
        <div id="control" style="display: flex; flex-direction: column; align-items: center">
          <div>
            Player 1 (Black):
            <select id="player1-choose"></select>
          </div>
          <div>
            Player 2 (White):
            <select id="player2-choose"></select>
          </div>
          <div>Iterations: <input id="iter" type="number" value="100" style="width: 10em" /></div>
          <button id="run-button">Run</button>
        </div>
        <p id="result" style="text-align: center;padding-bottom: 5px;"></p>
        <p id="elapsed"></p>
      </div>
    </div>
    <script type="module" src="./js/test.js"></script>
  </body>

  <html></html>
</html>
